<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Silvestre Hernández</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#060D1F">
    <link rel="icon" href="/Img/Logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2.2">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 2rem;
            text-align: center;
        }

        .not-found__code {
            font-family: var(--font-heading);
            font-size: 9.6rem;
            line-height: 1;
            color: var(--primary-text);
        }

        .not-found p {
            max-width: 420px;
            color: var(--text-muted);
            font-size: var(--text-lg);
        }
    </style>
</head>

<body>
    <main class="not-found">
        <span class="not-found__code">404</span>
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o cambió de lugar. / The page you're looking for doesn't exist.</p>
        <a href="/" class="btn-principal">Volver al inicio</a>
    </main>
</body>

</html>
